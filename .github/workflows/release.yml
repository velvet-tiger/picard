# Builds Picard for Apple Silicon, attaches the .dmg to a GitHub release and
# publishes it with the version's CHANGELOG.md section as its notes. Push a
# tag such as v0.1.0, or run it by hand from the Actions tab.
#
# Signing is optional. With all of these repository secrets set, the app is
# signed with a Developer ID and notarised by the Tauri CLI:
#   APPLE_CERTIFICATE           base64 of the Developer ID .p12 (base64 -i cert.p12)
#   APPLE_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Velvet Tiger (TEAMID)"
#   APPLE_ID                    Apple ID email used to notarise
#   APPLE_PASSWORD              app-specific password for that Apple ID
#   APPLE_TEAM_ID               ten-character team ID
# Without them the build is ad-hoc signed, and the release notes explain how
# to open it.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Lint and tests run third-party dev packages. They get a job of their own,
  # with no signing secrets and a read-only token, so nothing they do can
  # reach the job that signs. Neither job uses the Actions cache: code in this
  # job could write an entry that the release job would then restore.
  check:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - run: pnpm install --frozen-lockfile

      - run: make check

  macos:
    needs: check
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # Full history, so the next step can see whether main holds the tag.
          fetch-depth: 0
          # The release step gets its token from GH_TOKEN. Not storing it in
          # .git/config keeps it from every other step.
          persist-credentials: false

      # Anyone who can push a tag could otherwise sign and publish a commit
      # that never reached main.
      - name: Check main holds the tag
        run: |
          if ! git merge-base --is-ancestor "refs/tags/$TAG" refs/remotes/origin/main; then
            echo "::error::Tag $TAG is not on main. Merge the commit into main before tagging it."
            exit 1
          fi

      # A re-run must not replace the .dmg of a release people may already
      # have downloaded. A draft is fine to replace.
      - name: Refuse to replace a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if is_draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>&1); then
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $TAG is already published. Delete it on GitHub first to build it again."
              exit 1
            fi
          elif [[ "$is_draft" != *"release not found"* ]]; then
            echo "::error::Could not look up release $TAG: $is_draft"
            exit 1
          fi

      - name: Check the tag matches the app version
        run: |
          version="${TAG#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          tauri_version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          npm_version=$(node -p 'require("./package.json").version')
          echo "tag=$version Cargo.toml=$cargo_version tauri.conf.json=$tauri_version package.json=$npm_version"
          if [[ "$cargo_version" != "$version" || "$tauri_version" != "$version" || "$npm_version" != "$version" ]]; then
            echo "::error::Tag $TAG does not match the version in every file. Update all three before tagging."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - run: pnpm install --frozen-lockfile

      # The secrets are passed to this step and the build step only, so later
      # steps and the actions' post steps never see them.
      - name: Choose signing mode
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          names=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          missing=()
          for name in "${names[@]}"; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "Signing with a Developer ID and notarising."
          elif [[ ${#missing[@]} -eq ${#names[@]} ]]; then
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::No Apple signing secrets are set. The build will be ad-hoc signed."
          else
            echo "::error::Some Apple signing secrets are set but these are missing: ${missing[*]}"
            exit 1
          fi

      # The notes are the install line plus this version's CHANGELOG.md
      # section. A missing section fails here, before the long build.
      - name: Write release notes
        run: |
          changes=$(awk -v head="## [$VERSION]" '
            index($0, "## [") == 1 { if (found) exit; found = (index($0, head) == 1); next }
            !found || /^\[[^]]+\]: / { next }
            !started && /^[[:space:]]*$/ { next }
            { started = 1; print }
          ' CHANGELOG.md)
          if [[ -z "${changes//[[:space:]]/}" ]]; then
            echo "::error::CHANGELOG.md has no \"## [$VERSION]\" section, or the section is empty. Fill it in before tagging."
            exit 1
          fi
          {
            echo "Open the .dmg and drag Picard to Applications."
            if [[ "$SIGNED" != "true" ]]; then
              echo
              echo "This build is not signed with a Developer ID, so macOS will refuse to open it at first."
              echo "After copying it to Applications, run this once in Terminal:"
              echo
              echo '```bash'
              echo "xattr -cr /Applications/Picard.app"
              echo '```'
            fi
            echo
            echo "$changes"
          } > "$RUNNER_TEMP/notes.md"

      # Secrets that are not set arrive as empty strings. They are unset for
      # an ad-hoc build, because the Makefile's `?=` default for
      # APPLE_SIGNING_IDENTITY does not apply to a variable that is set but empty.
      - name: Build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$SIGNED" != "true" ]]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          make bundle

      # `make verify` passes an ad-hoc build too, so a signed build also needs
      # the notarisation ticket that Tauri staples to the app.
      - name: Verify the build
        run: |
          make verify
          if [[ "$SIGNED" == "true" ]]; then
            xcrun stapler validate src-tauri/target/release/bundle/macos/Picard.app
          fi

      # The release stays a draft until the .dmg is uploaded, so nobody sees it
      # without its file. A failed run can be re-run while it is still a draft.
      # A pre-release, or a release older than the latest, does not become
      # the latest release.
      - name: Upload the .dmg and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          dmg="src-tauri/target/release/bundle/dmg/Picard_${VERSION}_aarch64.dmg"
          test -f "$dmg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$dmg" --clobber
          else
            gh release create "$TAG" "$dmg" --draft --verify-tag \
              --title "Picard $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          if [[ "$VERSION" == *-* ]]; then
            flags=(--prerelease --latest=false)
          else
            latest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 \
              --json tagName,isLatest -q '.[] | select(.isLatest) | .tagName')
            newest=$(printf '%s\n%s\n' "${latest#v}" "$VERSION" | sort -V | tail -1)
            if [[ -n "$latest" && "$newest" != "$VERSION" ]]; then
              flags=(--latest=false)
            else
              flags=(--latest)
            fi
          fi
          gh release edit "$TAG" --title "Picard $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" --draft=false
