[package]
name = "picard"
version = "0.1.0"
description = "Menu bar app that watches free disk space and cleans up stale build output"
authors = ["Velvet Tiger"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "picard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["time", "sync"] }
libc = "0.2"
toml = "1.1.8"
anyhow = "1.0.104"
globset = "0.4.20"
notify = "8.2.0"
tauri-plugin-notification = "2"
walkdir = "2.5.0"
rayon = "1.12.0"
chrono = { version = "0.4.45", features = ["serde"] }
toml_edit = "0.25.17"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"

[dev-dependencies]
filetime = "0.2.29"
tempfile = "3.27.0"
