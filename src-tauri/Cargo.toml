[package]
name = "picard"
version = "0.1.0"
description = "Menu bar app that watches free disk space and cleans up stale build output"
authors = ["Velvet Tiger"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "picard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["time"] }
libc = "0.2"
